<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<!--
  Source for public/og.png (the 1200x630 social share card). Edit the name /
  tagline / domain below, then re-render:

    "/path/to/Chrome" --headless=new --disable-gpu --hide-scrollbars \
      --force-device-scale-factor=1 --window-size=1200,630 \
      --virtual-time-budget=6000 --run-all-compositor-stages-before-draw \
      --screenshot=public/og.png scripts/og.html
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #ffffff;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; justify-content: center;
    padding: 96px; position: relative; overflow: hidden;
  }
  .rule { width: 64px; height: 5px; background: #007ACC; border-radius: 3px; margin-bottom: 40px; }
  h1 { font-size: 92px; font-weight: 600; color: #1a1a1a; letter-spacing: -0.03em; line-height: 1.0; }
  .tag { margin-top: 28px; font-size: 37px; font-weight: 400; color: #666; letter-spacing: -0.01em; }
  .domain { position: absolute; left: 96px; bottom: 84px; font-size: 27px; font-weight: 500; color: #007ACC; letter-spacing: -0.01em; }
</style>
</head>
<body>
  <div class="rule"></div>
  <h1>Your&nbsp;Name</h1>
  <div class="tag">Writer, maker, explorer.</div>
  <div class="domain">example.com</div>
</body>
</html>
